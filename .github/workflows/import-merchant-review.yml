name: Import reviewed merchant decisions
on:
  pull_request:
    paths:
      - '.github/workflows/import-merchant-review.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: import-reviewed-merchant-decisions
  cancel-in-progress: false
jobs:
  import-reviewed-artifact:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'deploy/merchant-decisions-2026-09-22'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          package-manager-cache: false
      - name: Restore exact bytes from the completed test step
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, io, json, subprocess, zipfile
          from pathlib import Path
          root = Path('public/proofs/conversation-resolution')
          assert hashlib.sha256((root/'index.html').read_bytes()).hexdigest() == 'dbcbb3c93832bab3212d255d8993366093debc1902e0fd37e47a7b3612ce247a'
          raw = subprocess.check_output(['gh', 'api', 'repos/organvm-vii-kerygma/portfolio/actions/artifacts/10729125821/zip'])
          assert hashlib.sha256(raw).hexdigest() == '6b431bd776b861f7b708a76389ecb112b4fe70a80a7c4dc63642542d8571a1f6', 'Artifact integrity mismatch'
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              prefix = 'public/proofs/conversation-resolution/'
              receipt = json.loads(z.read(prefix+'verification.json'))
              report = json.loads(z.read('.quality/merchant-decisions/results.json'))
              assert report['completed'] is True and report['failure'] is None and report['failed'] == 0 and report['passed'] == 55
              assert report['modelCounts'] == {'paths':96, 'rejected':100}
              assert report['html_sha256'] == '908f6f333ca53c83332633eb9be84f502cf8cc2dd259448415dc0a7eab323a6e'
              for name, digest in receipt['artifacts_sha256'].items():
                  assert hashlib.sha256(z.read(prefix+name)).hexdigest() == digest, name
              for name in ['workflow-engine.js','test-workflow.cjs','test-additional.cjs']:
                  assert (root/name).read_bytes() == z.read(prefix+name), 'Unexpected legacy change'
              for name in ['index.html','legacy-guide.html','test-guide.cjs','test-guide-browser.cjs','test-merchant-decisions.cjs','verification.json']:
                  (root/name).write_bytes(z.read(prefix+name))
          print('Imported six exact presentation/test files from the completed 55-check test step. No workflow change is staged here.')
          PY
      - name: Verify the retained legacy model
        run: |
          node public/proofs/conversation-resolution/test-workflow.cjs
          node public/proofs/conversation-resolution/test-additional.cjs
          node public/proofs/conversation-resolution/test-guide.cjs
      - name: Commit verified content only to this branch
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/deploy/merchant-decisions-2026-09-22 | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/proofs/conversation-resolution/index.html public/proofs/conversation-resolution/legacy-guide.html public/proofs/conversation-resolution/test-guide.cjs public/proofs/conversation-resolution/test-guide-browser.cjs public/proofs/conversation-resolution/test-merchant-decisions.cjs public/proofs/conversation-resolution/verification.json
          git diff --cached --name-only | grep -q '^public/proofs/conversation-resolution/'
          test "$(git diff --cached --name-only | wc -l)" = 6
          git commit -m 'feat: add the reviewed merchant decision explorer and its verified tests'
          git push origin HEAD:refs/heads/deploy/merchant-decisions-2026-09-22
