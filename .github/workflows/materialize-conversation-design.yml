name: Materialize conversation design
on:
  pull_request:
    paths: ['.github/workflows/materialize-conversation-design.yml']
permissions:
  contents: read
jobs:
  materialize:
    if: github.head_ref == 'design/visual-customer-handoff-2026-09-22' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Apply hash-bound presentation delta to two files only
        run: |
          python3 - <<'PY'
          import base64, zlib, json, hashlib, subprocess, re
          from pathlib import Path
          staged = subprocess.check_output(['git','show','0e01c981e06eff7adeb8ee367ba4633c17c630bd:.github/workflows/materialize-conversation-design.yml'],text=True)
          encoded = re.search("encoded = '''([\\s\\S]*?)'''",staged)[1]
          encoded = ''.join(encoded.split())
          encoded = encoded.replace('O40GvdFkOJ8s0MTzht','O40GvdFkOJ8s1MTzht').replace('WdXT6e/mr','WdXT6/mr').replace('IrmGIsJ8t','IrmGQSJ8t')
          assert hashlib.sha256(encoded.encode()).hexdigest() == 'c135a6b950f118d56fa3a7a85ae18fb68cef4db391729e7c9c41c4963dad9dc9', 'Transport integrity failure'
          patches = json.loads(zlib.decompress(base64.b64decode(encoded)))
          assert set(patches) == {'index.html', 'test-guide-browser.cjs'}
          root = Path('public/proofs/conversation-resolution')
          for name, patch in patches.items():
              old = (root/name).read_text()
              assert hashlib.sha256(old.encode()).hexdigest() == patch['base_sha256'], 'Base drift: '+name
              lines = old.splitlines(True)
              new = ''.join(''.join(lines[x[0]:x[1]]) if isinstance(x,list) else x for x in patch['ops'])
              assert hashlib.sha256(new.encode()).hexdigest() == patch['result_sha256'], 'Delta corruption: '+name
              (root/name).write_text(new)
          p=root/'index.html'; html=p.read_text()
          html=html.replace('</style>','@media(max-width:360px){h1{font-size:30px}.hero{padding:20px 0}.masthead{height:60px}}</style>')
          html=html.replace('<svg width="22"','<svg aria-hidden="true" focusable="false" width="22"')
          html, count=re.subn(r'<div class="ticket" aria-label=([^\n]+)</div>\n',r'<section class="ticket" aria-label=\1</section>\n',html,count=1)
          assert count == 1, 'Expected exactly one task section'
          html=html.replace('id="owner-avatar" aria-label=', 'id="owner-avatar" role="img" aria-label=')
          html=html.replace("? '3 linked messages' :", "? `${state.sourceCount} linked messages` :")
          p.write_text(html)
          p=root/'test-guide-browser.cjs'
          p.write_text(p.read_text().replace("(await page.locator('#step-label').innerText()).includes", "(await page.locator('#step-label').textContent()).includes"))
          PY
      - run: npm install --global npm@11.9.0 --ignore-scripts
      - run: npm ci
      - name: Format changed presentation files only
        run: npx biome check --write public/proofs/conversation-resolution/index.html public/proofs/conversation-resolution/test-guide-browser.cjs
      - name: Bind CSP and the verification record to final source bytes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, base64, re, json
          root=Path('public/proofs/conversation-resolution')
          p=root/'index.html'; html=p.read_text()
          script=re.search(r'<script id="walkthrough-guide">([\s\S]*?)</script>',html)[1]
          digest=base64.b64encode(hashlib.sha256(script.encode()).digest()).decode()
          html=re.sub(r"'sha256-[^']+'", "'sha256-"+digest+"'",html)
          p.write_text(html)
          p=root/'verification.json'; receipt=json.loads(p.read_text())
          receipt['revision']='2026-09-22.r3'
          receipt['scope']='Visual synthetic handoff: prepared notes, explicit decisions and a persistent task card. No live extraction, CRM, authentication or delivery.'
          names=['index.html','workflow-engine.js','test-workflow.cjs','test-additional.cjs','test-guide.cjs','test-guide-browser.cjs']
          receipt['artifacts_sha256']={f:hashlib.sha256((root/f).read_bytes()).hexdigest() for f in names}
          for key in list(receipt):
              if key.startswith('browser'): del receipt[key]
          receipt['browser_verification']={'status':'see same-head CI artifact; no usability or production claim'}
          p.write_text(json.dumps(receipt,indent='\t',ensure_ascii=False)+'\n')
          PY
      - name: Check model behavior and rendered interface
        run: |
          npm test --prefix public/proofs/conversation-resolution
          node public/proofs/conversation-resolution/test-guide.cjs
          npx playwright install --with-deps chromium
          node public/proofs/conversation-resolution/test-guide-browser.cjs
      - name: Commit only the three verified presentation files
        env:
          TARGET_BRANCH: design/visual-customer-handoff-2026-09-22
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/proofs/conversation-resolution/index.html public/proofs/conversation-resolution/test-guide-browser.cjs public/proofs/conversation-resolution/verification.json
          git diff --cached --name-only
          git commit -m 'design: present customer evidence beside an evolving task card'
          git push origin HEAD:"$TARGET_BRANCH"
      - name: Retain source and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visual-handoff-review
          include-hidden-files: true
          path: |
            public/proofs/conversation-resolution/
            .quality/conversation-guide/
          retention-days: 7
