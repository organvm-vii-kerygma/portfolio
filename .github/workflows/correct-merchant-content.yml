name: Prepare merchant content correction
on:
  pull_request:
    paths:
      - 'scripts/correct-merchant-content.py'
      - '.github/workflows/correct-merchant-content.yml'
permissions:
  contents: write
concurrency:
  group: prepare-merchant-content-correction
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/merchant-content-and-choices-2026-09-23'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - name: Apply exact-source content correction
        run: python3 scripts/correct-merchant-content.py
      - run: npm install --global npm@11.9.0 --ignore-scripts
      - run: npm ci
      - name: Format and check changed JavaScript tests
        run: npx biome check --write public/proofs/conversation-resolution/test-merchant-decisions.cjs
      - name: Refresh exact source receipt
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('public/proofs/conversation-resolution')
          p = root / 'verification.json'
          receipt = json.loads(p.read_text())
          for name in receipt['artifacts_sha256']:
              receipt['artifacts_sha256'][name] = hashlib.sha256((root / name).read_bytes()).hexdigest()
          p.write_text(json.dumps(receipt, indent='\t') + '\n')
          PY
          npx biome format --write public/proofs/conversation-resolution/verification.json
      - run: npx playwright install --with-deps chromium
      - name: Verify actual HTTP interface and content contracts
        run: node public/proofs/conversation-resolution/test-merchant-decisions.cjs
      - name: Commit verified source to this branch only
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/fix/merchant-content-and-choices-2026-09-23 | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/proofs/conversation-resolution/index.html public/proofs/conversation-resolution/test-merchant-decisions.cjs public/proofs/conversation-resolution/verification.json
          git commit -m 'fix: audit merchant content and vary choices without positional cues'
          git push origin HEAD:refs/heads/fix/merchant-content-and-choices-2026-09-23
      - name: Preserve test report and reviewed source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: merchant-content-review
          path: |
            public/proofs/conversation-resolution/
            .quality/merchant-decisions/
          include-hidden-files: true
          retention-days: 7
