name: Conversation proof

on:
  pull_request:
    paths:
      - 'public/proofs/conversation-resolution/**'
      - '.github/workflows/conversation-proof.yml'
  push:
    branches: [main]
    paths:
      - 'public/proofs/conversation-resolution/**'
      - '.github/workflows/conversation-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Run deterministic engine and guided-flow checks
        run: |
          npm test --prefix public/proofs/conversation-resolution
          node public/proofs/conversation-resolution/test-guide.cjs
      - name: Verify the exact tested artifact bytes
        working-directory: public/proofs/conversation-resolution
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const assert = require('node:assert/strict');
          const receipt = JSON.parse(fs.readFileSync('verification.json', 'utf8'));
          const names = ['index.html', 'workflow-engine.js', 'test-workflow.cjs', 'test-additional.cjs', 'test-guide.cjs', 'test-guide-browser.cjs'];
          const actual = Object.fromEntries(names.map(name => [name, crypto.createHash('sha256').update(fs.readFileSync(name)).digest('hex')]));
          console.log(JSON.stringify(actual, null, 2));
          for (const name of names) assert.equal(actual[name], receipt.artifacts_sha256[name], `Unverified bytes: ${name}`);
          NODE
  guided-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.9.0 --ignore-scripts
      - run: npm ci
      - name: Verify formatting of guided test sources
        run: |
          npx biome format --write public/proofs/conversation-resolution/test-guide.cjs public/proofs/conversation-resolution/test-guide-browser.cjs
          git diff --exit-code -- public/proofs/conversation-resolution/test-guide.cjs public/proofs/conversation-resolution/test-guide-browser.cjs
      - run: npx playwright install --with-deps chromium
      - name: Test the actual HTTP-served walkthrough with CSP enforced
        run: node public/proofs/conversation-resolution/test-guide-browser.cjs
      - name: Retain exact source and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: guided-proof-review
          path: |
            public/proofs/conversation-resolution/
            .quality/conversation-guide/
          include-hidden-files: true
          retention-days: 7
