name: Conversation proof

on:
  pull_request:
    paths:
      - 'public/proofs/conversation-resolution/**'
      - '.github/workflows/conversation-proof.yml'
  push:
    branches: [main]
    paths:
      - 'public/proofs/conversation-resolution/**'
      - '.github/workflows/conversation-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Verify the exact tested artifact bytes
        working-directory: public/proofs/conversation-resolution
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const assert = require('node:assert/strict');
          const receipt = JSON.parse(fs.readFileSync('verification.json', 'utf8'));
          for (const name of ['index.html', 'workflow-engine.js', 'test-workflow.cjs', 'test-additional.cjs']) {
            const digest = crypto.createHash('sha256').update(fs.readFileSync(name)).digest('hex');
            assert.equal(digest, receipt.artifacts_sha256[name], `Unverified bytes: ${name}`);
            console.log(`${name}: ${digest}`);
          }
          NODE
      - name: Run deterministic acceptance and regression checks
        run: npm test --prefix public/proofs/conversation-resolution

  repair-proof-integration:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 264 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/conversation-resolution-proof-2026-09-22'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.9.0 --ignore-scripts
      - run: npm ci
      - name: Register standalone route and explicit button behavior
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'scripts/runtime-a11y-routes.json';
          const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (!manifest.routes.some((r) => r.path === '/proofs/conversation-resolution')) {
            manifest.routes.push({path: '/proofs/conversation-resolution', checks: []});
            fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + '\n');
          }
          const html = 'public/proofs/conversation-resolution/index.html';
          fs.writeFileSync(html, fs.readFileSync(html, 'utf8').replace(/<button(?![^>]*\btype=)/g, '<button type="button"'));
          NODE
      - name: Apply repository formatter and safe lint repairs to the proof only
        run: npx --no-install biome check --write --max-diagnostics=100 public/proofs/conversation-resolution
      - name: Rerun model checks and bind the formatted bytes
        run: |
          npm test --prefix public/proofs/conversation-resolution
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const base = 'public/proofs/conversation-resolution/';
          const file = base + 'verification.json';
          const receipt = JSON.parse(fs.readFileSync(file, 'utf8'));
          for (const name of ['index.html', 'workflow-engine.js', 'test-workflow.cjs', 'test-additional.cjs']) {
            receipt.artifacts_sha256[name] = crypto.createHash('sha256').update(fs.readFileSync(base + name)).digest('hex');
          }
          receipt.browser_source_verification.before_repository_formatting = true;
          receipt.browser_source_verification.note = 'The 41 source-level checks bind the recorded offline_combined_html hash before repository formatting. Final deployed-browser verification is separate.';
          fs.writeFileSync(file, JSON.stringify(receipt, null, 2) + '\n');
          NODE
          npx --no-install biome format --write public/proofs/conversation-resolution/verification.json
      - name: Commit only bounded integration repairs to this feature branch
        run: |
          git add public/proofs/conversation-resolution scripts/runtime-a11y-routes.json
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --stat
          git diff --cached --name-only | while read -r file; do
            case "$file" in
              public/proofs/conversation-resolution/*|scripts/runtime-a11y-routes.json) ;;
              *) echo "Unexpected repair path: $file"; exit 1 ;;
            esac
          done
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: format conversation proof and register runtime route'
          git push origin HEAD:refs/heads/feat/conversation-resolution-proof-2026-09-22
