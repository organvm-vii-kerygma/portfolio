name: Build Resume PDF

on:
  push:
    paths:
      - 'resume/Anthony_James_Padavano_CV.yaml'
      - 'resume/Anthony_James_Padavano_Multimedia.yaml'
      - 'resume/Anthony_James_Padavano_Developer.yaml'
      - 'scripts/render-resume-docx.py'
      - 'scripts/normalize-resume-docx-links.py'
      - 'public/resume/**'
      - '.github/workflows/build-resume.yml'
  pull_request:
    paths:
      - 'resume/Anthony_James_Padavano_CV.yaml'
      - 'resume/Anthony_James_Padavano_Multimedia.yaml'
      - 'resume/Anthony_James_Padavano_Developer.yaml'
      - 'scripts/render-resume-docx.py'
      - 'scripts/normalize-resume-docx-links.py'
      - 'public/resume/**'
      - '.github/workflows/build-resume.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: '1787270400'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install RenderCV
        run: pip install "rendercv[full]==2.6" "pypandoc_binary==1.15"

      - name: Render Creative Technologist resume
        run: |
          mkdir -p resume/rendercv_output
          rendercv render resume/Anthony_James_Padavano_CV.yaml \
            --pdf-path rendercv_output/Anthony_James_Padavano_CV.pdf \
            -md rendercv_output/Anthony_James_Padavano_CV.md

      - name: Render Multimedia Specialist resume
        run: |
          mkdir -p resume/rendercv_output_multimedia
          rendercv render resume/Anthony_James_Padavano_Multimedia.yaml \
            --pdf-path rendercv_output_multimedia/Anthony_James_Padavano_Multimedia.pdf \
            -md rendercv_output_multimedia/Anthony_James_Padavano_Multimedia.md

      - name: Render Developer resume
        run: |
          mkdir -p resume/rendercv_output_developer
          rendercv render resume/Anthony_James_Padavano_Developer.yaml \
            --pdf-path rendercv_output_developer/Anthony_James_Padavano_Developer.pdf \
            -md rendercv_output_developer/Anthony_James_Padavano_Developer.md

      - name: Generate DOCX from Creative Technologist Markdown
        run: python scripts/render-resume-docx.py resume/rendercv_output/Anthony_James_Padavano_CV.md resume/rendercv_output/Anthony_James_Padavano_CV.docx

      - name: Generate DOCX from Developer Markdown
        run: python scripts/render-resume-docx.py resume/rendercv_output_developer/Anthony_James_Padavano_Developer.md resume/rendercv_output_developer/Anthony_James_Padavano_Developer.docx

      - name: Normalize DOCX hyperlinks
        run: |
          python scripts/normalize-resume-docx-links.py \
            resume/rendercv_output/Anthony_James_Padavano_CV.docx \
            resume/rendercv_output_developer/Anthony_James_Padavano_Developer.docx

      - name: Copy outputs to public for Astro deployment
        run: |
          mkdir -p public/resume
          cp resume/rendercv_output/Anthony_James_Padavano_CV.pdf public/resume/Anthony_James_Padavano_CV.pdf
          cp resume/rendercv_output_multimedia/Anthony_James_Padavano_Multimedia.pdf public/resume/Anthony_James_Padavano_Multimedia.pdf
          cp resume/rendercv_output_developer/Anthony_James_Padavano_Developer.pdf public/resume/Anthony_James_Padavano_Developer.pdf
          cp resume/rendercv_output/Anthony_James_Padavano_CV.docx public/resume/Anthony_James_Padavano_CV.docx
          cp resume/rendercv_output_developer/Anthony_James_Padavano_Developer.docx public/resume/Anthony_James_Padavano_Developer.docx

      - name: Verify committed resume artifacts
        run: |
          python scripts/normalize-resume-docx-links.py --check \
            public/resume/Anthony_James_Padavano_CV.docx \
            public/resume/Anthony_James_Padavano_Developer.docx
          git diff --exit-code -- \
            public/resume/Anthony_James_Padavano_CV.pdf \
            public/resume/Anthony_James_Padavano_Multimedia.pdf \
            public/resume/Anthony_James_Padavano_Developer.pdf \
            public/resume/Anthony_James_Padavano_CV.docx \
            public/resume/Anthony_James_Padavano_Developer.docx

      - name: Upload rendered resume artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resume-${{ github.sha }}
          path: |
            public/resume/Anthony_James_Padavano_CV.pdf
            public/resume/Anthony_James_Padavano_Multimedia.pdf
            public/resume/Anthony_James_Padavano_Developer.pdf
            public/resume/Anthony_James_Padavano_CV.docx
            public/resume/Anthony_James_Padavano_Developer.docx

      - name: Create GitHub Release with PDFs
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: resume-${{ github.sha }}
          name: Resume — ${{ github.event.head_commit.timestamp }}
          files: |
            resume/rendercv_output/Anthony_James_Padavano_CV.pdf
            resume/rendercv_output_multimedia/Anthony_James_Padavano_Multimedia.pdf
            resume/rendercv_output_developer/Anthony_James_Padavano_Developer.pdf
            resume/rendercv_output/Anthony_James_Padavano_CV.docx
            resume/rendercv_output_developer/Anthony_James_Padavano_Developer.docx
          body: |
            Auto-generated resume PDFs from RenderCV YAML sources.

            - [Creative Technologist PDF](https://github.com/organvm-vii-kerygma/portfolio/releases/latest/download/Anthony_James_Padavano_CV.pdf)
            - [Multimedia Specialist PDF](https://github.com/organvm-vii-kerygma/portfolio/releases/latest/download/Anthony_James_Padavano_Multimedia.pdf)
            - [Developer PDF](https://github.com/organvm-vii-kerygma/portfolio/releases/latest/download/Anthony_James_Padavano_Developer.pdf)
